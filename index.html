<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A50 Cloud Control</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>

    <style>
        :root {
            --bg-grad: linear-gradient(135deg, #0d0f18 0%, #171a29 50%, #0d1117 100%);
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
            --accent: #7c4dff;
            --danger: #ff4757;
            --text: #e2e8f0;
            --text-dim: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background: var(--bg-grad);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .hidden { display: none !important; }
        .login-box { max-width: 400px; margin: 0 auto; text-align: center; }
        .input-group { margin-bottom: 16px; text-align: left; }
        .input-group label { display: block; font-size: 0.85rem; color: var(--text-dim); margin-bottom: 6px; }
        
        .input-control {
            width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--card-border);
            background: rgba(0,0,0,0.3); color: white; outline: none; font-size: 1rem;
        }

        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h1 { font-size: 1.5rem; font-weight: 700; background: linear-gradient(90deg, #a78bfa, #7c4dff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .status-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 20px; }
        .status-badge { background: rgba(0,0,0,0.3); border: 1px solid var(--card-border); padding: 10px 12px; border-radius: 12px; font-size: 0.8rem; display: flex; flex-direction: column; gap: 2px; }

        .nav-tabs { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 1px solid var(--card-border); padding-bottom: 10px; flex-wrap: wrap; }
        .tab-btn { flex: 1; text-align: center; background: none; border: none; color: var(--text-dim); padding: 10px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 0.9rem; min-width: 120px; }
        .tab-btn.active { background: var(--accent); color: white; }

        .path-bar { background: rgba(0,0,0,0.3); border: 1px solid var(--card-border); padding: 12px 16px; border-radius: 12px; font-family: monospace; color: var(--accent); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; word-break: break-all; font-size: 0.9rem; }
        .drop-zone { border: 2px dashed var(--accent); border-radius: 16px; padding: 24px 16px; text-align: center; background: rgba(124, 77, 255, 0.03); cursor: pointer; transition: all 0.3s ease; margin-bottom: 20px; }

        .btn { background: var(--accent); color: white; border: none; padding: 12px 20px; border-radius: 12px; font-weight: 600; cursor: pointer; transition: 0.2s; font-size: 0.9rem; }
        .btn-danger { background: var(--danger); }

        .file-list { list-style: none; max-height: 350px; overflow-y: auto; }
        .file-item { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; background: rgba(255, 255, 255, 0.02); border: 1px solid var(--card-border); border-radius: 12px; margin-bottom: 8px; gap: 10px; }
        .file-item-name { display: flex; align-items: center; gap: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* Espelhamento de Tela Otimizado */
        .screen-container { display: flex; flex-direction: column; align-items: center; gap: 12px; }
        .screen-wrapper { position: relative; border-radius: 16px; overflow: hidden; border: 2px solid var(--card-border); max-width: 320px; width: 100%; background: #000; min-height: 500px; display: flex; align-items: center; justify-content: center; }
        #screenImg { width: 100%; height: auto; display: block; cursor: pointer; touch-action: none; }
        .controls-row { display: flex; gap: 8px; width: 100%; max-width: 320px; justify-content: space-between; }
        .control-btn { flex: 1; padding: 10px 4px; font-size: 0.8rem; }

        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: flex-end; z-index: 100; }
        .modal-content { background: #171a29; border: 1px solid var(--card-border); padding: 24px; border-top-left-radius: 24px; border-top-right-radius: 24px; max-width: 500px; width: 100%; }

        @media (min-width: 600px) {
            body { padding: 32px; }
            .container { padding: 32px; }
            h1 { font-size: 1.8rem; }
            .status-badge { flex-direction: row; font-size: 0.85rem; justify-content: space-between; }
            .tab-btn { flex: initial; }
            .modal { align-items: center; }
            .modal-content { border-radius: 24px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div id="loginView" class="login-box">
        <h1 style="margin-bottom: 8px;">Painel A50</h1>
        <p style="color: var(--text-dim); margin-bottom: 20px; font-size: 0.9rem;">Autenticação Firebase</p>
        
        <form onsubmit="handleFirebaseLogin(event)">
            <div class="input-group">
                <label>URL do Servidor Termux (Cloudflare)</label>
                <input type="url" id="serverUrl" class="input-control" required placeholder="https://xyz.trycloudflare.com">
            </div>
            <div class="input-group">
                <label>E-mail</label>
                <input type="email" id="email" class="input-control" required placeholder="seuemail@exemplo.com">
            </div>
            <div class="input-group">
                <label>Palavra-passe</label>
                <input type="password" id="password" class="input-control" required placeholder="••••••••">
            </div>
            <button type="submit" id="loginBtn" class="btn" style="width: 100%; margin-top: 10px;">Entrar</button>
        </form>
    </div>

    <div id="dashboardView" class="hidden">
        <header>
            <div>
                <h1>A50 Server</h1>
                <span id="userBadge" style="font-size: 0.75rem; color: var(--accent);">--</span>
            </div>
            <button class="btn" style="background: rgba(255,255,255,0.1); padding: 8px 14px; font-size: 0.8rem;" onclick="handleLogout()">Sair</button>
        </header>

        <div class="status-bar">
            <div class="status-badge"><span>🔋 Bateria</span><strong id="batLevel">--</strong></div>
            <div class="status-badge"><span>📶 Wi-Fi</span><strong id="wifiStatus">--</strong></div>
            <div class="status-badge"><span>📊 Em uso</span><strong id="storageUsed">--</strong></div>
            <div class="status-badge"><span>💾 Livre</span><strong id="storageFree">--</strong></div>
        </div>

        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('screen')">🖥️ Tela ao Vivo</button>
            <button class="tab-btn" onclick="switchTab('files')">📁 Arquivos</button>
            <button class="tab-btn" onclick="switchTab('apps')">📱 Aplicativos</button>
        </div>

        <!-- Tab Tela -->
        <div id="screenTab">
            <div class="screen-container">
                <div class="screen-wrapper">
                    <img id="screenImg" alt="Aguardando tela do A50...">
                </div>
                <div class="controls-row">
                    <button class="btn control-btn" onclick="sendKey(187)">||| Recentes</button>
                    <button class="btn control-btn" onclick="sendKey(3)">🏠 Início</button>
                    <button class="btn control-btn" onclick="sendKey(4)">⬅️ Voltar</button>
                    <button class="btn control-btn btn-danger" onclick="sendKey(26)">🔌 Liga/Desl</button>
                </div>
            </div>
        </div>

        <!-- Tab Arquivos -->
        <div id="filesTab" class="hidden">
            <div class="path-bar"><span>📍 /sdcard/</span><span id="currentPath"></span></div>
            <div class="drop-zone" id="dropZone">
                <p style="margin-bottom: 12px; color: var(--text-dim); font-size: 0.85rem;">Toque para selecionar ficheiros</p>
                <button class="btn" onclick="document.getElementById('fileInput').click()">Selecionar Ficheiro</button>
                <input type="file" id="fileInput" hidden onchange="uploadFile(this.files[0])">
            </div>
            <ul class="file-list" id="fileList"></ul>
        </div>

        <!-- Tab Apps -->
        <div id="appsTab" class="hidden">
            <h3 style="margin-bottom: 12px; font-size: 1.1rem;">Apps Instalados</h3>
            <ul class="file-list" id="appList"></ul>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDs4N2fetINRXBej47HlqsuBgNRZTKhae0",
        authDomain: "xvideos-85dd1.firebaseapp.com",
        projectId: "xvideos-85dd1",
        storageBucket: "xvideos-85dd1.firebasestorage.app",
        messagingSenderId: "657672668903",
        appId: "1:657672668903:web:1f6ac226858cbdc3fe4442",
        measurementId: "G-X05PRTYQCX"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    let API_BASE_URL = localStorage.getItem('a50_server_url') || '';
    let authToken = localStorage.getItem('a50_token') || '';
    let isStreaming = false;
    let startX = 0, startY = 0;

    if (API_BASE_URL) {
        document.getElementById('serverUrl').value = API_BASE_URL;
    }

    function getAuthHeaders() {
        return {
            'Authorization': `Bearer ${authToken}`,
            'Content-Type': 'application/json'
        };
    }

    function showLogin() {
        isStreaming = false;
        document.getElementById('loginView').classList.remove('hidden');
        document.getElementById('dashboardView').classList.add('hidden');
    }

    function showDashboard() {
        document.getElementById('loginView').classList.add('hidden');
        document.getElementById('dashboardView').classList.remove('hidden');
        startScreenStream();
        loadSystemStatus();
    }

    function switchTab(tab) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('screenTab').classList.add('hidden');
        document.getElementById('filesTab').classList.add('hidden');
        document.getElementById('appsTab').classList.add('hidden');

        if (tab === 'screen') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('screenTab').classList.remove('hidden');
            startScreenStream();
        } else if (tab === 'files') {
            isStreaming = false;
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('filesTab').classList.remove('hidden');
            loadFiles();
        } else if (tab === 'apps') {
            isStreaming = false;
            document.querySelectorAll('.tab-btn')[2].classList.add('active');
            document.getElementById('appsTab').classList.remove('hidden');
            loadApps();
        }
    }

    // STREAMING DE TELA COMPATÍVEL VIA HTTP
    async function startScreenStream() {
        if (isStreaming) return;
        isStreaming = true;
        const img = document.getElementById('screenImg');
        setupTouchEvents(img);

        while (isStreaming) {
            try {
                const res = await fetch(`${API_BASE_URL}/api/screen/frame?t=${Date.now()}`, { headers: getAuthHeaders() });
                if (res.ok) {
                    const blob = await res.blob();
                    img.src = URL.createObjectURL(blob);
                }
            } catch (e) {}
            await new Promise(r => setTimeout(r, 200)); // ~5 frames por segundo (extremamente estável via Cloudflare)
        }
    }

    function setupTouchEvents(img) {
        img.onpointerdown = (e) => {
            const rect = img.getBoundingClientRect();
            // Resolução do A50 (1080x2340)
            startX = Math.round(((e.clientX - rect.left) / rect.width) * 1080);
            startY = Math.round(((e.clientY - rect.top) / rect.height) * 2340);
        };

        img.onpointerup = (e) => {
            const rect = img.getBoundingClientRect();
            const endX = Math.round(((e.clientX - rect.left) / rect.width) * 1080);
            const endY = Math.round(((e.clientY - rect.top) / rect.height) * 2340);

            const dist = Math.hypot(endX - startX, endY - startY);

            if (dist < 20) {
                sendInput({ type: 'tap', x: startX, y: startY });
            } else {
                sendInput({ type: 'swipe', x1: startX, y1: startY, x2: endX, y2: endY, duration: 300 });
            }
        };
    }

    async function sendInput(data) {
        try {
            await fetch(`${API_BASE_URL}/api/screen/input`, {
                method: 'POST',
                headers: getAuthHeaders(),
                body: JSON.stringify(data)
            });
        } catch(e) {}
    }

    function sendKey(code) {
        sendInput({ type: 'key', code: code });
    }

    async function handleFirebaseLogin(e) {
        e.preventDefault();
        const btn = document.getElementById('loginBtn');
        btn.innerText = 'Entrando...';
        btn.disabled = true;

        const serverUrlInput = document.getElementById('serverUrl').value.replace(/\/$/, '');
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        API_BASE_URL = serverUrlInput;
        localStorage.setItem('a50_server_url', API_BASE_URL);

        try {
            const userCredential = await auth.signInWithEmailAndPassword(email, password);
            const user = userCredential.user;
            authToken = await user.getIdToken();

            localStorage.setItem('a50_token', authToken);
            document.getElementById('userBadge').innerText = user.email;

            showDashboard();
        } catch (error) {
            alert('Erro no login Firebase: ' + error.message);
        } finally {
            btn.innerText = 'Entrar';
            btn.disabled = false;
        }
    }

    async function handleLogout() {
        isStreaming = false;
        await auth.signOut();
        localStorage.removeItem('a50_token');
        showLogin();
    }

    async function loadSystemStatus() {
        try {
            const res = await fetch(`${API_BASE_URL}/api/system`, { headers: getAuthHeaders() });
            if (res.ok) {
                const data = await res.json();
                document.getElementById('batLevel').innerText = data.battery;
                document.getElementById('wifiStatus').innerText = data.wifi;
                document.getElementById('storageUsed').innerText = data.storage.used + ' / ' + data.storage.total;
                document.getElementById('storageFree').innerText = data.storage.free;
            }
        } catch(e) {}
    }

    if (authToken && API_BASE_URL) {
        showDashboard();
    } else {
        showLogin();
    }
</script>
</body>
</html>
